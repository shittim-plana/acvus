[package]
name = "pomollu-core"
version = "0.1.0"
edition = "2021"
description = "Pomollu core — OAuth, crypto, persistence, provider clients (no Tauri dependency, host-testable)"
license = "MIT"

[dependencies]
acvus-ext-llm = { path = "../../acvus-ext-llm" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"

aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
