[package]
name = "pomollu-tauri"
version = "0.1.0"
edition = "2021"
description = "Pomollu — local-first Tauri mobile app for the acvus orchestration engine"
license = "MIT"

# Standalone workspace — intentionally detached from the acvus root workspace.
[workspace]
members = ["pomollu-core"]

[lib]
name = "pomollu_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pomollu-core = { path = "pomollu-core" }

tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
