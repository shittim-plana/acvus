[workspace]
resolver = "3"
members = [
    "acvus-utils",
    "acvus-interpreter",
    "acvus-interpreter-test",
    "acvus-ast",
    "acvus-mir",
    "acvus-mir-cli",
    "acvus-mir-test",
    "acvus-orchestration",
    "acvus-ext",
    "acvus-ext-llm",
    "acvus-lsp",
    "pomollu-engine",
    "acvus-macro",
    "kovac-interpreter"
, "acvus-mir-host", "acvus-mir-host-macro"]
# pomollu-tauri is its own workspace: Tauri's dependency tree (wry, JNI glue,
# reqwest/rustls) should not unify versions with the wasm-targeted crates here,
# and desktop `cargo check --workspace` must not require webkit2gtk.
exclude = ["pomollu-tauri"]

[workspace.dependencies]
rustc-hash = "2"
uuid = { version = "1", features = ["v4", "js"] }

[profile.release]
opt-level = 'z'
lto = true
